name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Vérification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Valider la base d'exercices
        run: npm run data:validate

      - name: Build de production
        run: npm run build
