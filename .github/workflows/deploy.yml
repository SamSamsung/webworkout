name: Déploiement GitHub Pages (optionnel)

# Hébergement alternatif, gardé sous la main mais volontairement manuel : le
# déploiement principal du projet passe par Vercel, qui gère lui-même les
# builds à chaque push. Ce workflow ne se déclenche donc que sur demande
# explicite (Actions → Run workflow), afin de ne pas faire échouer la CI tant
# que GitHub Pages n'a pas été activé sur le dépôt.
#
# Prérequis avant de le lancer : Settings → Pages → Build and deployment →
# Source = « GitHub Actions » (le jeton d'un workflow ne peut pas créer le
# site lui-même), et, si la branche déployée n'est pas la branche par défaut,
# l'autoriser dans Settings → Environments → github-pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants remplacent celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Valider la base d'exercices
        run: npm run data:validate

      # Prérequis, à faire une seule fois et manuellement : dans
      # Settings → Pages → Build and deployment, choisir la source
      # « GitHub Actions ». Le jeton d'un workflow n'a pas le droit de créer
      # le site Pages lui-même, seulement d'y publier.
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build (export statique)
        env:
          NEXT_OUTPUT: export
          # Le site est servi depuis https://<user>.github.io/<repo>/ :
          # toutes les URL doivent être préfixées par le nom du dépôt.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Facultatifs : définis-les en secrets de dépôt pour activer la
          # synchronisation Supabase sur le site déployé.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Désactiver le traitement Jekyll
        # Sans ce fichier, un hébergement Pages classique ignorerait le dossier
        # `_next` à cause de son tiret bas.
        run: touch out/.nojekyll

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
